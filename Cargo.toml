[package]
name = "button_badger"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Auto-align images for printing as button/badge template cutouts"

[dependencies]
iced = { version = "0.14.0", features = ["image", "svg", "canvas", "advanced", "tokio"] }
image = "0.25"
rfd = "0.17"
pdf-writer = "0.15"
miniz_oxide = "0.8"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dark-light = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintOperation", "NSPrintInfo", "NSPrintPanel", "NSView", "NSResponder", "NSWindow"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Foundation", "Win32_UI_Controls_Dialogs"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
